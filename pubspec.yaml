name: talentbridge
description: TalentBridge recruitment platform — Flutter app (mobile + web)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2
  file_picker: ^11.0.3
  fl_chart: ^0.68.0
  intl: ^0.19.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  file_saver: ^0.4.0
  flutter_dotenv: ^6.0.1
  socket_io_client: ^3.1.6
  http: ^1.6.0
  uuid: ^4.6.0
  livekit_client: ^2.6.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/logo.jpeg
    - lib/assets/images/white-logo.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "lib/assets/images/logo.jpeg"